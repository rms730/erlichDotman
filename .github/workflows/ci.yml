name: core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-30
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest
      - run: engineering-cascade eval --root . --mode routing
      - run: engineering-cascade eval --root . --mode fixtures --execute
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: engineering-cascade validate examples/task.json --kind task
